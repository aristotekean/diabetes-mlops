[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-model"
version = "0.1.0"
description = "Shared preprocessing and training pipeline for the diabetes MLOps project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]
