# Diabetes MLOps · Locust load generator (Server B)
#
# Included by the root docker-compose.yml under the `loadtest` profile, so a
# plain `docker compose up` never starts it. Paths are relative to this file.
#
# Local, against the API of the same compose network (from the repository root):
#   docker compose --profile loadtest up -d
#   UI on http://localhost:8089, target defaults to http://api-inference:8000
#
# On Server B, standalone (the API stack lives on Server A; this never starts it,
# so the CPU spent simulating users does not compete with the API):
#   LOCUST_HOST=http://<SERVER_A>:<PORT> docker compose -f docker-compose.yml up -d
#
# Headless, same parameters for every run. The master coordinates the workers
# (--expect-workers), so the traffic comes from LOCUST_WORKERS processes.
# -u users, -r spawn rate, -t duration; --csv writes the stats to ./results.
#   mkdir -p results     # create it first: Docker would create it as root
#   LOCUST_HOST=http://<SERVER_A>:<PORT> \
#   LOCUST_ARGS="--headless -u 50 -r 5 -t 3m --csv /mnt/results/u50" \
#   docker compose --profile loadtest up --abort-on-container-exit
#
# Watch the generator too (`docker stats`): if it saturates before the API,
# the numbers describe the generator, not the service.
# Tunables (env or .env): LOCUST_HOST, LOCUST_WORKERS, LOCUST_PORT, LOCUST_ARGS.

x-locust: &locust
  image: locustio/locust:2.46.7
  profiles: [ "loadtest" ]
  volumes:
    - .:/mnt/locust:ro

services:
  locust-master:
    <<: *locust
    container_name: diabetes-locust-master
    command: >-
      -f /mnt/locust/locustfile.py --master
      --host ${LOCUST_HOST:-http://api-inference:8000}
      --expect-workers ${LOCUST_WORKERS:-2} ${LOCUST_ARGS:-}
    ports:
      - "${LOCUST_PORT:-8089}:8089"
    volumes:
      - .:/mnt/locust:ro
      - ./results:/mnt/results

  # Workers generate the traffic; the master only coordinates and aggregates.
  # One worker per generator CPU core is a reasonable default.
  locust-worker:
    <<: *locust
    command: -f /mnt/locust/locustfile.py --worker --master-host locust-master
    deploy:
      replicas: ${LOCUST_WORKERS:-2}
    depends_on:
      - locust-master
