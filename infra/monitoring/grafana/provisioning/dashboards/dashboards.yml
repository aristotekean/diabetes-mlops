# Grafana dashboard provisioning · loads every JSON under /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: diabetes-mlops
    orgId: 1
    folder: Diabetes MLOps
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
