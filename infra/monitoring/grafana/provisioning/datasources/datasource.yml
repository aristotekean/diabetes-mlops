# Grafana datasource provisioning · the Prometheus of this stack.
# The fixed uid (`prometheus`) is what the provisioned dashboard references,
# so the dashboard binds to this datasource automatically on first start.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Env-driven so the same provisioning works in both modes (Grafana expands
    # environment variables in provisioning files):
    #   base compose          -> http://prometheus:9090   (separate containers)
    #   tailscale sidecar mode -> http://localhost:9090    (shared net namespace)
    url: $PROMETHEUS_URL
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
