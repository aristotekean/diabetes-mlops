# Kustomize root for Server A of the diabetes MLOps stack on Kubernetes
# (OrbStack locally; any cluster with a default StorageClass otherwise).
#
# Usage:
#   kubectl apply -k infra/k8s            # deploy / update everything
#   kubectl kustomize infra/k8s           # render the manifests only
#   kubectl -n diabetes get pods          # watch the rollout
#
# Everything lands in the `diabetes` namespace. Project images are pinned here
# in one place (`images:`) so a release only bumps the three newTag values.
# Third-party images (postgres, minio, mlflow) are pinned in their own
# manifests to match docker-compose.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diabetes

# Shared label on every object (metadata and pod templates, not selectors, so
# adding or renaming it never breaks an existing Deployment/Service pairing).
labels:
  - pairs:
      app.kubernetes.io/part-of: diabetes
    includeSelectors: false
    includeTemplates: true

resources:
  - base/config
  - base/postgres-mlflow
  - base/minio
  - base/mlflow

# Published multi-arch (amd64 + arm64) images built from this repository.
# They are referenced by name only inside the service manifests; the tag is
# set here.
images:
  - name: aristotekean/diabetes-api-inference
    newTag: "0.1.0"
  - name: aristotekean/diabetes-frontend
    newTag: "0.1.0"
  - name: aristotekean/diabetes-airflow
    newTag: "0.1.0"
