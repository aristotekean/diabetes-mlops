# Non-secret part of the `x-airflow-common` environment in
# apps/airflow/compose.yml, attached with `envFrom` to the init Job and to the
# four Airflow containers. Secrets (database URL, keys, TRAIN_DB_PASSWORD) and
# the MLflow/MinIO client settings (`mlflow-client-env`, `minio-credentials`)
# are attached separately so this file holds plain configuration only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-env
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Task runners (subprocesses of the scheduler) call the execution API of the
  # api-server container in the SAME pod, so localhost is used instead of the
  # `airflow-apiserver` Service: it does not depend on that Service's
  # readiness gate and never leaves the pod. The Service stays for the Ingress
  # and the UI. The path must keep its trailing slash.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
  # Lets /api/v2/monitor/health report the scheduler heartbeat.
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  # S5 · training database the DAGs read from and write to (base/postgres-train).
  # Database name, user and password come from the `postgres-train-credentials`
  # Secret (TRAIN_DB_NAME / TRAIN_DB_USER / TRAIN_DB_PASSWORD env entries in
  # deployment.yaml), the same source api-inference uses.
  TRAIN_DB_HOST: postgres-train
  TRAIN_DB_PORT: "5432"
  # The DAG downloads the CSV here on first run (pvc.yaml); the directory needs
  # outbound HTTPS to Google Drive.
  DIABETES_DATASET_PATH: /opt/airflow/data/Diabetes/Diabetes.csv
  DIABETES_SOURCE_URI: https://docs.google.com/uc?export=download&confirm=t&id=1k5-1caezQ3zWJbKaiMULTGq-3sz6uThC
  # S2 · MLflow experiment / registry names (tracking URI in `mlflow-client-env`).
  MLFLOW_EXPERIMENT_NAME: diabetes-readmission
  MODEL_NAME: diabetes
  MODEL_ALIAS: production
  # Each run loads the next RAW batch, so a short interval replays the
  # incremental arrival of the 7 batches in about an hour.
  DIABETES_TRAINING_SCHEDULE: "*/10 * * * *"
