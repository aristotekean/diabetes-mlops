# Secret part of the `x-airflow-common` environment in apps/airflow/compose.yml,
# with the same development defaults. Attached with `envFrom` next to the
# `airflow-env` ConfigMap.
#
# These are NOT production values: set a real Fernet key and JWT secret and
# rotate the database password (and the copy in
# base/postgres-airflow/secret.yaml) before exposing the cluster beyond a local
# network.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
type: Opaque
stringData:
  # user:password@host:port/db must match base/postgres-airflow/secret.yaml and
  # the `airflow-db` Service; Airflow needs the whole URL in one variable.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
  # Empty as in compose: connection passwords and variables are then stored
  # unencrypted in the metadata database. Production needs a real key
  # (`python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`).
  AIRFLOW__CORE__FERNET_KEY: ""
  # Signs the tokens between the api-server and the task runners; every
  # container in the pod must see the same value.
  AIRFLOW__API_AUTH__JWT_SECRET: change-me-jwt-secret
---
# Admin user created once by the `airflow-init` Job (FabAuthManager). Kept in
# its own Secret so only the Job sees the password, not the running services.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-admin-user
type: Opaque
stringData:
  _AIRFLOW_WWW_USER_USERNAME: airflow
  _AIRFLOW_WWW_USER_PASSWORD: airflow
