# Web UI and REST API of the api-server container, reached by the Ingress. The
# name matches the compose hostname `airflow-apiserver:8080`; inside the pod the
# task runners use localhost instead (AIRFLOW__CORE__EXECUTION_API_SERVER_URL
# in base/airflow/kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: airflow-apiserver
  labels:
    app.kubernetes.io/name: airflow
spec:
  selector:
    app.kubernetes.io/name: airflow
  ports:
    - name: http
      port: 8080
      targetPort: http
