# Airflow metadata database (PostgreSQL), internal to the stack and separate
# from the training database. Reached as `airflow-db` (same hostname as in
# apps/airflow/compose.yml) and only used by base/airflow.
#
# Credentials: Secret `airflow-db-credentials`, rendered from AIRFLOW_DB_* in
# .env by infra/k8s/scripts/render-env.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
