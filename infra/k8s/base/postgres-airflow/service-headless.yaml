# Headless Service required by the airflow-db StatefulSet (spec.serviceName):
# it gives the pod the stable DNS name airflow-db-0.airflow-db-headless. Clients
# keep using the regular `airflow-db` Service in service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: airflow-db-headless
  labels:
    app.kubernetes.io/name: airflow-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: airflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
