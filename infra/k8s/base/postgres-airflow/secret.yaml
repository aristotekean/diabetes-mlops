# Development defaults, identical to the `airflow-db` service in
# apps/airflow/compose.yml. The Postgres container reads the POSTGRES_* keys on
# first start; the probes read the same keys so the user/db are not repeated.
#
# base/airflow/secret.yaml embeds these values in
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN; change both together.
#
# These are NOT production credentials: rotate them (or replace this Secret
# with an external one) before exposing the cluster beyond a local network.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-db-credentials
type: Opaque
stringData:
  POSTGRES_DB: airflow
  POSTGRES_USER: airflow
  POSTGRES_PASSWORD: airflow
