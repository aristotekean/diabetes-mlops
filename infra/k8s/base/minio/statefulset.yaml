apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  # Single-node MinIO owns its data directory: a StatefulSet
  # gives the pod a stable identity (minio-0), its own PVC from
  # volumeClaimTemplates below (kept across restarts and deletes) and an
  # update that terminates the old pod before creating the new one, so two
  # instances never write the same volume. The headless Service names
  # the pod as minio-0.minio-headless; clients keep using
  # `minio`.
  serviceName: minio-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      # The image runs as the unprivileged `nonroot` user (65532). fsGroup
      # makes the freshly provisioned volume writable by that user.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-credentials
            # MINIO_PROMETHEUS_AUTH_TYPE from .env (infra/k8s/generated), as in
            # docker-compose.yml: `public` lets Prometheus (Server C) scrape
            # /minio/v2/metrics/cluster without a bearer token.
            - configMapRef:
                name: minio-env
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          # Single-node store for MLflow artifacts; the 1Gi ceiling covers MinIO's
          # own caches on this stack's volumes.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # compose uses `mc ready local`; here the unauthenticated health
          # endpoints are used so the kubelet probes over HTTP (no exec
          # needed). /ready answers 200 only once the server can serve
          # requests, /live only says the process is up.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
  # One PVC per pod, named data-minio-0; no storageClassName: the
  # cluster default is used (OrbStack: `local-path`, bound when the pod is
  # scheduled). The PVC outlives the pod and the StatefulSet.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
