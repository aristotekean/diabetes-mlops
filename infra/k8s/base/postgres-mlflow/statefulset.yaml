apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-db
  labels:
    app.kubernetes.io/name: mlflow-db
spec:
  replicas: 1
  # A single Postgres instance owns the volume: a StatefulSet
  # gives the pod a stable identity (mlflow-db-0), its own PVC from
  # volumeClaimTemplates below (kept across restarts and deletes) and an
  # update that terminates the old pod before creating the new one, so two
  # instances never write the same volume. The headless Service names
  # the pod as mlflow-db-0.mlflow-db-headless; clients keep using
  # `mlflow-db`.
  serviceName: mlflow-db-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: mlflow-db-credentials
            # Non-sensitive settings (PGDATA), from the ConfigMap in
            # kustomization.yaml.
            - configMapRef:
                name: mlflow-db-env
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Sized for this stack's load (single app, small datasets); raise the
          # limits if a training run or a migration gets OOMKilled.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # POSTGRES_USER / POSTGRES_DB come from the Secret through envFrom.
          # The kubelet expands $(VAR) in exec probes only from env entries
          # with a literal `value`, so the probes go through `sh -c` and let
          # the shell read them instead of repeating the values as literals.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  # One PVC per pod, named data-mlflow-db-0; no storageClassName: the
  # cluster default is used (OrbStack: `local-path`, bound when the pod is
  # scheduled). The PVC outlives the pod and the StatefulSet.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
