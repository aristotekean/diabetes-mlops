# Headless Service required by the mlflow-db StatefulSet (spec.serviceName):
# it gives the pod the stable DNS name mlflow-db-0.mlflow-db-headless. Clients
# keep using the regular `mlflow-db` Service in service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: mlflow-db-headless
  labels:
    app.kubernetes.io/name: mlflow-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mlflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
