# Namespace of the stack. The configuration shared by the services
# (mlflow-client-env, minio-credentials and the other ConfigMaps/Secrets) is
# rendered from .env into infra/k8s/generated by scripts/render-env.sh. Service
# manifests reference those objects by name with `envFrom`, so keep the names
# stable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
