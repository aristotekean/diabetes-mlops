# Development defaults, identical to docker-compose.yml. MinIO reads the
# MINIO_ROOT_* pair; S3 clients (boto3 inside mlflow, api-inference, airflow)
# read the AWS_* pair. Both point at the same dev account so one Secret can be
# attached with `envFrom` wherever it is needed.
#
# These are NOT production credentials: rotate them (or replace this Secret
# with an external one) before exposing the cluster beyond a local network.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
