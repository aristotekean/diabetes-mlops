# S5 · PostgreSQL training database (RAW, CLEAN and INFERENCE schemas) plus
# the one-shot `train-db-migrate` Job that applies infra/database migrations.
# Reached as `postgres-train` (same hostname as in apps/airflow/compose.yml).
#
# migrations-configmap.yaml is GENERATED from infra/database by
# infra/k8s/scripts/render-migrations.sh; never edit it by hand.
#
# Credentials: Secret `postgres-train-credentials`, rendered from TRAIN_DB_*
# in .env by infra/k8s/scripts/render-env.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
  - service-headless.yaml
  - migrations-configmap.yaml
  - job-migrate.yaml

# Non-sensitive configuration of the database container (the credentials
# stay in the Secret above). initdb refuses a non-empty directory and some
# provisioners drop a `lost+found` at the mount root, so the cluster lives one
# level below the mount point.
configMapGenerator:
  - name: postgres-train-env
    literals:
      - PGDATA=/var/lib/postgresql/data/pgdata
