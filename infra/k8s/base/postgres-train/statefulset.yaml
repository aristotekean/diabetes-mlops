apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-train
  labels:
    app.kubernetes.io/name: postgres-train
spec:
  replicas: 1
  # A single Postgres instance owns the volume: a StatefulSet
  # gives the pod a stable identity (postgres-train-0), its own PVC from
  # volumeClaimTemplates below (kept across restarts and deletes) and an
  # update that terminates the old pod before creating the new one, so two
  # instances never write the same volume. The headless Service names
  # the pod as postgres-train-0.postgres-train-headless; clients keep using
  # `postgres-train`.
  serviceName: postgres-train-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-train
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-train
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            # Declared one by one (not envFrom) so the variables the probes
            # below read are visible here instead of hidden in the Secret.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-train-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-train-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-train-credentials
                  key: POSTGRES_PASSWORD
          envFrom:
            # Non-sensitive settings (PGDATA), from the ConfigMap in
            # kustomization.yaml.
            - configMapRef:
                name: postgres-train-env
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Sized for this stack's load (single app, small datasets); raise the
          # limits if a training run or a migration gets OOMKilled.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The kubelet expands $(VAR) in exec probes only from env entries
          # with a literal `value`, never from secretKeyRef, so the probes go
          # through `sh -c` and let the shell read the Secret-backed variables.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  # One PVC per pod, named data-postgres-train-0; no storageClassName: the
  # cluster default is used (OrbStack: `local-path`, bound when the pod is
  # scheduled). The PVC outlives the pod and the StatefulSet.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
