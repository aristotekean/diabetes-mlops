# Development defaults, identical to apps/airflow/compose.yml and
# docker-compose.yml (TRAIN_DB_*). The Postgres container reads the POSTGRES_*
# keys on first start; the migration Job and api-inference read the same keys
# through secretKeyRef so there is a single source for the credentials.
#
# These are NOT production credentials: rotate them (or replace this Secret
# with an external one) before exposing the cluster beyond a local network.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-train-credentials
type: Opaque
stringData:
  POSTGRES_DB: diabetes
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
