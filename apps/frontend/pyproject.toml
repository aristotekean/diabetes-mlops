[project]
name = "frontend"
version = "0.1.0"
description = "Streamlit frontend for the diabetes inference API"
readme = "README.md"
authors = [
    { name = "aristotekean", email = "kean.solano@gmail.com" }
]
requires-python = ">=3.15.1"
dependencies = [
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
